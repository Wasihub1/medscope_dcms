<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MedScope DCMS sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#525333}a:hover{color:#26270F}
input::placeholder{color:#6B6C48}
@keyframes ecg{0%{stroke-dashoffset:900}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}
@keyframes rise{0%{opacity:0;transform:translateY(32px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-16px)}}
@keyframes pulse{0%{transform:scale(1);opacity:0.9}100%{transform:scale(2.4);opacity:0}}
.ecg{stroke-dasharray:900;stroke-dashoffset:900;animation:ecg 4.2s cubic-bezier(0.22,1,0.36,1) infinite}
.card{opacity:0;animation:rise 9s cubic-bezier(0.22,1,0.36,1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s cubic-bezier(0.22,1,0.36,1) infinite}
@media (prefers-reduced-motion: reduce){.ecg,.card,.ring{animation:none;opacity:1;stroke-dashoffset:0;transform:none}}
</style>
</helmet>
<div style="font-family: 'Manrope','Noto Sans Bengali',system-ui,sans-serif; display: flex; flex-wrap: wrap; min-height: 820px; color: #26270F">

<!-- LEFT: animated brand panel -->
<div style="flex: 1 1 560px; min-width: 0; background: #525333; color: #FFFFFF; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="{{accent}}"></rect><path d="M16 8v16M8 16h16" stroke="#26270F" stroke-width="3" stroke-linecap="round" fill="none"></path></svg>
<span style="font-size: 24px; font-weight: 700; line-height: 32px">MedScope DCMS</span>
</div>

<div>
<svg viewBox="0 0 520 160" width="100%" style="display: block" role="img" aria-label="Animated heartbeat line">
<line x1="0" y1="90" x2="520" y2="90" stroke="#E8E7E3" stroke-opacity="0.25" stroke-width="2"></line>
<path d="M0 90 H90 L110 90 L128 30 L150 140 L170 58 L188 90 H300 L320 90 L338 44 L358 120 L376 90 H520" fill="none" stroke="{{accent}}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="ecg"></path>
<circle cx="128" cy="30" r="6" fill="{{accent}}"></circle>
<circle cx="128" cy="30" r="6" fill="{{accent}}" class="ring"></circle>
</svg>

</div>

<p style="margin: 0; max-width: 420px; font-size: 14px; line-height: 20px; color: #E8E7E3; text-wrap: pretty">Illustration only. No patient information is shown on this page.</p>
</div>

<!-- RIGHT: sign-in -->
<div style="flex: 1 1 480px; min-width: 0; background: #E8E7E3; padding: 48px; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
<div style="width: 100%; max-width: 420px; background: #FFFFFF; border-radius: 24px; padding: 40px; box-sizing: border-box">
<h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 600; color: #26270F">Sign in</h1>
<p style="margin: 8px 0 0; font-size: 14px; line-height: 20px; color: #3D3E1F; text-wrap: pretty">Use your own account. What you see depends on your role.</p>

<div style="margin-top: 32px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="user" style="font-size: 14px; line-height: 20px; font-weight: 600">Username</label>
<input id="user" type="text" placeholder="Your username" autocomplete="username" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 16px; border: 1px solid #525333; border-radius: 12px; font-family: inherit; font-size: 16px; color: #26270F; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pass" style="font-size: 14px; line-height: 20px; font-weight: 600">Password</label>
<div style="display: flex; gap: 8px">
<input id="pass" type="password" placeholder="Your password" autocomplete="current-password" style="box-sizing: border-box; flex: 1 1 auto; min-width: 0; height: 48px; padding: 0 16px; border: 1px solid #525333; border-radius: 12px; font-family: inherit; font-size: 16px; color: #26270F; background: #FFFFFF">
<button type="button" aria-label="Show password" style="flex: none; height: 48px; padding: 0 16px; border: 1px solid #525333; border-radius: 12px; background: #FFFFFF; color: #525333; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Show</button>
</div>
</div>
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: {{accent}}; color: #26270F; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Sign in</button>
</div>

<p style="margin: 24px 0 0; font-size: 14px; line-height: 20px; color: #3D3E1F; text-wrap: pretty">Forgot your password? Ask your center administrator to reset it.</p>
<p style="margin: 16px 0 0; font-size: 14px; line-height: 20px"><a href="Main.dc.html" style="font-weight: 600">Back to the overview</a></p>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#CF8852","options":["#CF8852","#B8733F","#E0A06E"]},"$preview":{"width":1360,"height":820}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#CF8852' };
}
}
</script>
</body>
</html>
